server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: appointment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:appointment_db}}
    username: ${DB_USER:appointment_user}
    password: ${DB_PASSWORD:appointment_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    clean-at-start: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:${CATEDRA_KAFKA_SERVERS:172.17.201.1:9094}}
    consumer:
      group-id: ${KAFKA_GROUP_ID:${CATEDRA_KAFKA_GROUP:alumnos-proyecto-turnos}}
  data:
    redis:
      host: ${REDIS_HOST:${CATEDRA_REDIS_HOST:172.17.201.1}}
      port: ${REDIS_PORT:${CATEDRA_REDIS_PORT:6379}}
      username: ${REDIS_USERNAME:${CATEDRA_REDIS_USER:}}
      password: ${REDIS_PASSWORD:${CATEDRA_REDIS_PASSWORD:}}

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForTestingPurposesWithAtLeast512BitsLengthHereToSatisfyJJWTRequirementsForHS512AlgorithmAndProductionUse}
  expiration: 31536000000
