server:
  port: 8081

spring:
  application:
    name: appointment-service
  datasource:
    url: jdbc:postgresql://localhost:5434/appointment_db
    username: appointment_user
    password: appointment_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:172.17.201.1:9094}
    consumer:
      group-id: ${KAFKA_GROUP_ID:alumnos-proyecto-turnos}
  data:
    redis:
      host: ${REDIS_HOST:172.17.201.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ0ZXN0c3VyaSI...cambiar-por-un-secreto-muy-seguro-y-largo-en-produccion}
  expiration: 31536000000