spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/appointment_db
    username: appointment_user
    password: appointment_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8081
