services:
  appointment-db:
    image: postgres:16-alpine
    container_name: appointment-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-appointment_db}
      POSTGRES_USER: ${DB_USER:-appointment_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-appointment_pass}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - appointment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appointment_user} -d ${DB_NAME:-appointment_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  appointment_pgdata:
